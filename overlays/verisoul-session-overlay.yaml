overlay: 1.0.0
info:
  title: API Evangelist enhancements for Verisoul Session API
  version: 1.0.0
extends: openapi/verisoul-session-openapi.json
actions:
  - target: $.info
    update:
      x-apievangelist-rating: 4
      x-apievangelist-note: Enrichment overlay — adds production server and operationIds absent from the source spec.
  - target: $.servers
    update:
      - url: https://api.prod.verisoul.ai
        description: Production
      - url: https://api.sandbox.verisoul.ai
        description: Sandbox
  - target: $.paths['/session/{session_id}'].get
    update: {operationId: getSession}
  - target: $.paths['/session/authenticate'].post
    update: {operationId: authenticateSession}
  - target: $.paths['/session/unauthenticated'].post
    update: {operationId: unauthenticatedSession}
