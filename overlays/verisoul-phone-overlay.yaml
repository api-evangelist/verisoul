overlay: 1.0.0
info:
  title: API Evangelist enhancements for Verisoul Phone API
  version: 1.0.0
extends: openapi/verisoul-phone-openapi.json
actions:
  - target: $.info
    update:
      x-apievangelist-rating: 4
      x-apievangelist-note: Enrichment overlay — adds production server and operationId absent from the source spec.
  - target: $.servers
    update:
      - url: https://api.prod.verisoul.ai
        description: Production
      - url: https://api.sandbox.verisoul.ai
        description: Sandbox
  - target: $.paths['/phone'].post
    update: {operationId: verifyPhone, summary: Phone Verification}
