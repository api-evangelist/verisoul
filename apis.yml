aid: verisoul
name: Verisoul
description: >-
  Verisoul is a fake-account and fraud detection platform that helps businesses
  stop bots, fake signups, and multi-accounting. It combines device
  fingerprinting, network and location signals, bot detection, email
  intelligence (risk, deliverability, breach, and identity signals), phone
  validation, and account linking with an automated rules engine and ML models.
  Verisoul also offers hosted identity verification products — Face Match
  (liveness/selfie dedup) and ID Check (government-ID document verification) —
  and manages biometric capture, consent, and retention on the customer's
  behalf. It exposes a REST API (Account, Session, Lists, Phone, Email
  Intelligence, Face Match, ID Check) authenticated with an x-api-key header,
  plus web and mobile SDKs and signed webhooks. Verisoul is backed by 500 Global.
